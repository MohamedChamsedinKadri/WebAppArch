<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 1</title>
    <script type="text/javascript" src="../../libraries/react.development.js"></script>
    <script type="text/javascript" src="../../libraries/react-dom.development.js"></script>
    <script type="text/javascript" src="../../libraries/babel.min.js"></script>
</head>
<body>

<div id="container"></div>
<script type="text/babel">
    function App() {

        const [count, useCount] = React.useState(0);
        return (
            <>
                <h1>Counter: {count}</h1>
                <button onClick={() => useCount(count+1)}>+1</button> <button onClick={() => useCount(count - 1)}>-1</button>
            </>
        );
    }
    const root = ReactDOM.createRoot(document.getElementById('container'));
    root.render(<App />);
</script>

</body>
</html>
