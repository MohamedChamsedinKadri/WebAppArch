<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="text/javascript" src="../libraries/react.development.js"></script>
    <script type="text/javascript" src="../libraries/react-dom.development.js"></script>
    <script type="text/javascript" src="../libraries/babel.min.js"></script>
</head>
<body>
<div id="container"></div>
<script type="text/babel">

    class MyComponent extends React.Component {

        state = {
            opacity: 1,
            index: 0,
            intervalId: undefined
        }

        unmountMyCom = () => {
            console.log('inside unmountMyCom');
            root.unmount();
            clearInterval(this.state.timerId);
            clearInterval(this.state.intervalId);
        }

        constructor(props) {
            console.log('MyComponent --- constructor');
            super(props);
        }

        componentDidMount() {
            console.log('MyComponent --- componentDidMount');
            const timerId = setInterval(() => {
                console.log('setInterval.......');
                const {opacity} = this.state;
                if (opacity <= 0.1) {
                    this.setState({opacity: 1})
                } else {
                    this.setState({opacity: opacity - 0.1});
                }
            }, 200);
            this.setState({timerId});

            const intervalId = setInterval(() => {
                console.log(this.state.index)
                if (this.state.index++ >= 5) {
                    this.setState({index: 0})
                } else {
                    this.setState({index: this.state.index})
                }
                console.log(`Interval Id ${this.state.index}`)
            }, 1000)

            this.setState({intervalId});
        }

        // componentDidUpdate(prevProps, prevState, snapshot) {
        //     console.log('MyComponent --- componentDidUpdate', prevProps, prevState, snapshot);
        // }

        render() {
            console.log('render.......');
            const {opacity} = this.state;

            return (
                <div>
                    <h1 style={{opacity}}>Time flies fast~~~~~~~</h1>
                    <button onClick={() => this.setState({opacity: opacity - 0.1})}>Click Me</button>
                    <button onClick={this.unmountMyCom}>Kill Me</button>
                </div>
            );
        }
    }

    const root = ReactDOM.createRoot(document.getElementById('container'));
    root.render(<MyComponent username="John"/>);
</script>
</body>
</html>
